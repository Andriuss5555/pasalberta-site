  <!-- WhatsApp Button CSS -->
  <style>
  .whatsapp-float {
    position: fixed;
    width: 60px;
    height: 60px;
    bottom: 40px;
    right: 40px;
    background-color: #25D366;
    color: #FFF;
    border-radius: 50px;
    text-align: center;
    font-size: 30px;
    box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.3);
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
    text-decoration: none;
  }

  .whatsapp-float:hover {
    background-color: #128C7E;
    transform: scale(1.1);
    box-shadow: 2px 2px 20px rgba(0, 0, 0, 0.4);
  }

  .whatsapp-icon {
    width: 32px;
    height: 32px;
    color: white;
  }

  .whatsapp-tooltip {
    position: absolute;
    right: 70px;
    background-color: #333;
    color: white;
    padding: 8px 12px;
    border-radius: 5px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    font-size: 14px;
    font-weight: normal;
  }

  .whatsapp-float:hover .whatsapp-tooltip {
    opacity: 1;
  }

  /* Pulse animation */
  @keyframes pulse {
    0% {
      box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.7);
    }
    70% {
      box-shadow: 0 0 0 10px rgba(37, 211, 102, 0);
    }
    100% {
      box-shadow: 0 0 0 0 rgba(37, 211, 102, 0);
    }
  }

  .whatsapp-float {
    animation: pulse 2s infinite;
  }

  /* Mobile responsive */
  @media (max-width: 768px) {
    .whatsapp-float {
      width: 50px;
      height: 50px;
      bottom: 20px;
      right: 20px;
    }
    
    .whatsapp-icon {
      width: 26px;
      height: 26px;
    }
    
    .whatsapp-tooltip {
      display: none;
    }
  }

  /* Don't show on print */
  @media print {
    .whatsapp-float {
      display: none;
    }
  }
  </style>
