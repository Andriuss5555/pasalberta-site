# Netlify Configuration for PasAlberta - PRODUCTION VERSION

[[redirects]]
  from = "http://pasalberta.lt/*"
  to = "https://pasalberta.lt/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.pasalberta.lt/*"
  to = "https://pasalberta.lt/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    
    # Complete CSP with ALL Tawk.to domains
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://calendar.google.com https://www.googletagmanager.com https://www.google.com https://embed.tawk.to https://va.tawk.to; style-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://fonts.googleapis.com; img-src 'self' data: https: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://formsubmit.co https://embed.tawk.to https://va.tawk.to https://*.tawk.to wss://tawk.to wss://*.tawk.to https://www.google-analytics.com https://www.googletagmanager.com; frame-src https://calendar.google.com https://www.google.com; form-action 'self' https://formsubmit.co; base-uri 'self'; object-src 'none';"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[build]
  publish = "."

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
